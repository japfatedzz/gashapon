        run: |
          printf '%s' "$PROJECT_ZIP_B64" | base64 --decode > project.zip
          unzip -q project.zip
          rm project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LevelUp-Gashapon.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Gashapon-APK
          path: LevelUp-Gashapon.apk
          if-no-files-found: error
          retention-days: 14
          
