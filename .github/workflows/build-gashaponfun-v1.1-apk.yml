        run: |
          set -euo pipefail
          printf '%s\n' "$PROJECT_ZIP_B64" | tr -d '\n\r ' | base64 --decode > /tmp/gashaponfun.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/gashaponfun.zip') as z:
              z.extractall('.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build GashaponFun 1.1 APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GashaponFun.apk

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 GashaponFun.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs GashaponFun.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging GashaponFun.apk | head -20

      - name: Upload GashaponFun APK
        uses: actions/upload-artifact@v4
        with:
          name: GashaponFun-APK
          path: GashaponFun.apk
          if-no-files-found: error
          retention-days: 14
          
